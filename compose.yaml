    ports:
      - "127.0.0.1:${MEMMY_MEMORY_HOST_PORT:-18960}:18960"
    volumes:
      - memory-data:/data
      - memory-model-cache:/home/node/.memmy/memory-service/model-cache
      - ${HOME}/.pi/agent/sessions:/home/node/.pi/agent/sessions:ro
      - ${HOME}/.codex/sessions:/home/node/.codex/sessions:ro
      - ${HOME}/.claude/transcripts:/home/node/.claude/transcripts:ro
      - ${HOME}/.config/manicode:/home/node/.config/manicode:ro
      - ${HOME}/.dsh:/home/node/.dsh:ro
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:18960/api/v1/health').then(r=>{if(!r.ok)throw new Error(String(r.status))})
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=512m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 15s

  web:
    build:
      context: .
      dockerfile: Web/Dockerfile
    image: memmy-web:local
    restart: unless-stopped
    init: true
    depends_on:
      memory:
        condition: service_healthy
    environment:
      MEMMY_MEMORY_TOKEN: "${MEMMY_MEMORY_TOKEN:?Set a strong random MEMMY_MEMORY_TOKEN in .env}"
      MEMMY_WEB_PORT: "80"
    ports:
      - "127.0.0.1:${MEMMY_WEB_HOST_PORT:-19000}:80"
    read_only: true
    tmpfs:
      - /etc/nginx/conf.d:rw,noexec,nosuid,size=1m
      - /var/run:rw,noexec,nosuid,size=8m
      - /tmp:rw,noexec,nosuid,size=8m,uid=101,gid=101
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 10s

volumes:
  memory-data:
  memory-model-cache:

