client_body_temp_path /tmp/client_temp;
proxy_temp_path /tmp/proxy_temp;
fastcgi_temp_path /tmp/fastcgi_temp;
uwsgi_temp_path /tmp/uwsgi_temp;
scgi_temp_path /tmp/scgi_temp;
map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

server {
  listen ${MEMMY_WEB_PORT};
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy same-origin always;

  location = /__memmy_runtime_config {
    default_type application/json;
    add_header Cache-Control no-store always;
    return 200 '{"baseUrl":"${MEMMY_WEB_PUBLIC_URL}","localToken":"${MEMMY_BACKEND_TOKEN}","memory":{"baseUrl":"${MEMMY_WEB_PUBLIC_URL}","token":"${MEMMY_MEMORY_TOKEN}","ownership":"managed"}}';
  }

  location = /api/events {
    proxy_pass http://agent-api:18100;
    proxy_http_version 1.1;
    proxy_set_header x-memmy-local-token ${MEMMY_BACKEND_TOKEN};
    proxy_set_header Host agent-api;
    proxy_buffering off;
    proxy_read_timeout 1h;
  }

  location /api/v1/ {
    proxy_pass http://memory:18960;
    proxy_http_version 1.1;
    proxy_set_header Authorization "Bearer ${MEMMY_MEMORY_TOKEN}";
    proxy_set_header Host memory;
    proxy_read_timeout 1h;
  }

  location /api/ {
    proxy_pass http://agent-api:18100;
    proxy_http_version 1.1;
    proxy_set_header x-memmy-local-token ${MEMMY_BACKEND_TOKEN};
    proxy_set_header Host agent-api;
    proxy_read_timeout 1h;
  }

  location /webui/ {
    proxy_pass http://agent-api:18100;
    proxy_http_version 1.1;
    proxy_set_header x-memmy-local-token ${MEMMY_BACKEND_TOKEN};
    proxy_set_header Host agent-api;
    proxy_read_timeout 1h;
  }

  location /api/webui/ {
    proxy_pass http://agent-api:18100;
    proxy_http_version 1.1;
    proxy_set_header x-memmy-local-token ${MEMMY_BACKEND_TOKEN};
    proxy_set_header Host agent-api;
    proxy_read_timeout 1h;
  }

  location = /memory {
    return 301 /memory/;
  }

  location = /memory/ {
    try_files /memory/index.html =404;
  }

  location /memory/ {
    try_files $uri $uri/ /memory/index.html;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
